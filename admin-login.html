</head>

<body>
<nav class="admin-navbar">

    <div class="admin-logo">
        <i class="fa-solid fa-book-open"></i>
        <span>MyBlog Admin</span>
    </div>

    <a href="web.html" class="back-home">
        <i class="fa-solid fa-house"></i>
        Back to Home
    </a>

</nav>

<main class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Login to manage your MyBlog articles.
        </p>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="adminUsername">
                    Username
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        required>

                </div>

            </div>


<div class="form-group">

    <label for="adminPassword">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>
                Login as Admin

            </button>

        </form>


        <div id="loginMessage" class="message"></div>



    </div>

</main>


<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("adminPassword");

    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            this.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        } else {
            passwordInput.type = "password";
            this.innerHTML = '<i class="fa-solid fa-eye"></i>';
        }
    });
const loginForm = document.getElementById("adminLoginForm");
    const loginMessage = document.getElementById("loginMessage");

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "MyBlog@2026";

    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const username = document
            .getElementById("adminUsername")
            .value
            .trim();

        const password = document
            .getElementById("adminPassword")
            .value
            .trim();
        const usernameOK =
            username.toLowerCase() === ADMIN_USERNAME.toLowerCase();

        const passwordOK =
            password === ADMIN_PASSWORD;

        if (usernameOK && passwordOK) {

            localStorage.setItem(
                "myBlogAdminLoggedIn",
                "true"
            );

            loginMessage.textContent =
                "Login successful! Opening Admin Dashboard...";

            loginMessage.className =
                "message success";
            setTimeout(function () {
                window.location.href = "admin-dashboard.html";
            }, 500);

        } else {

            loginMessage.textContent =
                "Please enter the correct Admin Login details.";

            loginMessage.className =
                "message error";
        }
    });
</script>
</body>
