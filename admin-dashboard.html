<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - MyBlog</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="we.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
            transition: background 0.3s ease,
                        color 0.3s ease;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }

        .admin-page {
            min-height: 100vh;
            background: #f5f7fb;
            transition: background 0.3s ease;
        }
        .admin-header {
            width: 100%;
            background: #111827;
            color: white;

            padding: 16px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }


        .admin-logo {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 23px;
            font-weight: 700;

            white-space: nowrap;
        }


        .admin-logo i {
            color: #60a5fa;
            font-size: 25px;
        }


        .admin-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-btn {
            border: none;

            min-height: 42px;

            padding: 10px 16px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .admin-btn:hover {
            transform: translateY(-2px);
        }


        .add-btn {
            background: #2563eb;
            color: white;
        }


        .add-btn:hover {
            background: #1d4ed8;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.35);
        }


        .dark-btn {
            background: #374151;
            color: white;
        }


        .dark-btn:hover {
            background: #4b5563;
        }


        .logout-btn {
            background: #ef4444;
            color: white;
        }


        .logout-btn:hover {
            background: #dc2626;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.30);
        }

        .admin-container {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            padding: 35px 20px 50px;
        }
        .dashboard-title {
            margin-bottom: 28px;
        }


        .dashboard-title h1 {
            margin: 0 0 8px;

            font-size: 32px;
            line-height: 1.2;

            color: #111827;
        }


        .dashboard-title p {
            margin: 0;

            color: #6b7280;

            font-size: 15px;
        }
        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .stat-card {
            background: white;

            padding: 22px;

            border-radius: 15px;

            display: flex;
            align-items: center;

            gap: 17px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);

            border: 1px solid transparent;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.3s ease;
        }


        .stat-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.10);
        }


        .stat-icon {
            width: 56px;
            height: 56px;

            flex-shrink: 0;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eff6ff;
            color: #2563eb;

            font-size: 23px;
        }


        .stat-info h3 {
            margin: 0;

            font-size: 28px;

            line-height: 1;

            color: #111827;
        }


        .stat-info p {
            margin: 6px 0 0;

            color: #6b7280;

            font-size: 14px;
        }

        .articles-box {
            width: 100%;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);

            overflow: hidden;

            transition: background 0.3s ease;
        }
        .articles-header {
            padding: 20px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }


        .articles-header h2 {
            margin: 0;

            font-size: 21px;

            color: #111827;
        }
        .search-box {
            position: relative;

            width: 280px;
        }


        .search-box i {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: #9ca3af;

            pointer-events: none;
        }


        .search-box input {
            width: 100%;

            padding:
                11px
                12px
                11px
                38px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            outline: none;

            background: white;
            color: #111827;

            font-size: 14px;

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease,
                background 0.3s ease;
        }


        .search-box input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }


        .article-table {
            width: 100%;

            min-width: 850px;

            border-collapse: collapse;
        }


        .article-table th,
        .article-table td {
            padding: 15px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;
        }


        .article-table th {
            background: #f9fafb;

            color: #374151;

            font-size: 13px;

            font-weight: 700;

            white-space: nowrap;
        }


        .article-table td {
            color: #4b5563;

            font-size: 14px;

            vertical-align: middle;
        }


        .article-table tbody tr {
            transition: background 0.2s ease;
        }


        .article-table tbody tr:hover {
            background: #f9fafb;
        }

        .image-cell {
            width: 100px;
        }


        .article-image {
            width: 75px;
            height: 55px;

            object-fit: cover;

            border-radius: 8px;

            display: block;

            background: #e5e7eb;

            border: 1px solid #e5e7eb;
        }

        .article-title {
            max-width: 280px;

            font-weight: 600;

            color: #111827;

            line-height: 1.4;
        }
        .category-badge {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;
        }

        .action-buttons {
            display: flex;

            align-items: center;

            gap: 7px;
        }


        .action-btn {
            width: 35px;
            height: 35px;

            border: none;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        .action-btn:hover {
            transform: translateY(-2px);
        }


        .view-btn {
            background: #ecfdf5;
            color: #059669;
        }


        .view-btn:hover {
            background: #d1fae5;
        }


        .edit-btn {
            background: #eff6ff;
            color: #2563eb;
        }


        .edit-btn:hover {
            background: #dbeafe;
        }


        .delete-btn {
            background: #fef2f2;
            color: #dc2626;
        }


        .delete-btn:hover {
            background: #fee2e2;
        }
        .empty-state {
            text-align: center;

            padding: 65px 20px;

            color: #6b7280;
        }


        .empty-state i {
            display: block;

            margin-bottom: 17px;

            font-size: 46px;

            color: #9ca3af;
        }


        .empty-state h3 {
            margin: 0 0 8px;

            color: #374151;

            font-size: 20px;
        }


        .empty-state p {
            margin: 0;

            font-size: 14px;
        }

        body.dark-mode {
            background: #0f172a;
            color: #e5e7eb;
        }


        body.dark-mode .admin-page {
            background: #0f172a;
        }


        body.dark-mode .dashboard-title h1 {
            color: #f9fafb;
        }


        body.dark-mode .dashboard-title p {
            color: #9ca3af;
        }


        body.dark-mode .stat-card,
        body.dark-mode .articles-box {
            background: #1e293b;

            border-color: #334155;
        }


        body.dark-mode .stat-card:hover {
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.30);
        }


        body.dark-mode .stat-icon {
            background: #172554;
            color: #60a5fa;
        }


        body.dark-mode .stat-info h3 {
            color: #f9fafb;
        }


        body.dark-mode .stat-info p {
            color: #94a3b8;
        }


        body.dark-mode .articles-header {
            border-color: #334155;
        }


        body.dark-mode .articles-header h2 {
            color: #f9fafb;
        }


        body.dark-mode .article-table th {
            background: #334155;
            color: #e5e7eb;

            border-color: #475569;
        }


        body.dark-mode .article-table td {
            color: #cbd5e1;

            border-color: #334155;
        }


        body.dark-mode .article-table tbody tr:hover {
            background: #263449;
        }


        body.dark-mode .article-title {
            color: #f9fafb;
        }


        body.dark-mode .category-badge {
            background: #172554;
            color: #93c5fd;
        }


        body.dark-mode .article-image {
            border-color: #475569;
            background: #334155;
        }


        body.dark-mode .search-box input {
            background: #111827;
            color: #f9fafb;

            border-color: #475569;
        }


        body.dark-mode .search-box input::placeholder {
            color: #94a3b8;
        }


        body.dark-mode .search-box input:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(96, 165, 250, 0.12);
        }


        body.dark-mode .empty-state {
            color: #94a3b8;
        }


        body.dark-mode .empty-state h3 {
            color: #e5e7eb;
        }


        body.dark-mode .empty-state i {
            color: #64748b;
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }


            .admin-header {
                padding: 15px 20px;
            }


            .admin-container {
                padding: 30px 15px 45px;
            }

        }


        /* =====================================================
           RESPONSIVE - MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            .admin-header {
                position: relative;

                flex-direction: column;

                align-items: stretch;

                gap: 15px;
            }


            .admin-logo {
                justify-content: center;

                font-size: 21px;
            }


            .admin-actions {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 7px;
            }


            .admin-btn {
                width: 100%;

                padding: 10px 7px;

                font-size: 12px;
            }


            .admin-btn i {
                font-size: 12px;
            }


            .dashboard-title {
                margin-bottom: 22px;
            }


            .dashboard-title h1 {
                font-size: 26px;
            }


            .dashboard-title p {
                font-size: 14px;
                line-height: 1.5;
            }


            .stat-card {
                padding: 18px;
            }


            .stat-icon {
                width: 50px;
                height: 50px;
            }


            .stat-info h3 {
                font-size: 24px;
            }


            .articles-header {
                flex-direction: column;

                align-items: stretch;

                padding: 17px;
            }


            .articles-header h2 {
                font-size: 19px;
            }


            .search-box {
                width: 100%;
            }


            .table-wrapper {
                overflow-x: auto;
            }

        }
        @media (max-width: 400px) {

            .admin-container {
                padding:
                    22px
                    10px
                    35px;
            }


            .admin-actions {
                grid-template-columns: 1fr;
            }


            .admin-btn {
                min-height: 40px;
            }


            .dashboard-title h1 {
                font-size: 23px;
            }


            .stat-card {
                gap: 13px;
            }

        }

.dark-btn {
    min-width: 110px;

.dark-btn i {
    width: 20px;

.dark-btn:hover {

    }

}

    </style>

</head>


<body>

<div class="admin-page">
    <header class="admin-header">

        <div class="admin-logo">

            <i class="fa-solid fa-book-open"></i>

            <span>
                MyBlog Admin
            </span>

        </div>


        <div class="admin-actions">

            <a
                href="add-article.html"

        </div>

    </header>

    <main class="admin-container">

        <div class="dashboard-title">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage your MyBlog articles from one place.
            </p>

        </div>
        <div class="stats-grid">
            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-newspaper"></i>

                </div>


                <div class="stat-info">

                    <h3 id="totalArticles">
                        0
                    </h3>

                    <p>
                        Total Articles
                    </p>

                </div>

            </div>
            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-layer-group"></i>

                </div>


                <div class="stat-info">

                    <h3 id="totalCategories">
                        0
                    </h3>

                    <p>
                        Categories
                    </p>

                </div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-pen-to-square"></i>

                </div>


                <div class="stat-info">

                    <h3 id="adminArticles">
                        0
                    </h3>

                    <p>
                        Admin Added
                    </p>

                </div>

            </div>

        <section class="articles-box">

            <div class="articles-header">

                <h2>
                    All Articles
                </h2>


                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="search"
                        id="articleSearch"
                        placeholder="Search articles..."
                        autocomplete="off">

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-wrapper">

                <table class="article-table">

                    <thead>

                        <tr>

                            <th>

                            </th>

                            <th>
                                Title
                            </th>

                            <th>

                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </tbody>

                id="emptyState"
                class="empty-state"
                style="display: none;">

                    Add a new article or change your search.
                </p>

    </main>

</div>

<script src="we.js"></script>


<script>

"use strict";

document.addEventListener(
    "DOMContentLoaded",
    function () {

        setupAdminLogin();

        setupDashboardDarkMode();

        setupDashboardSearch();

        setupLogout();

        loadAdminDashboard();

    }
);

function setupAdminLogin() {

    const loggedIn =
        localStorage.getItem(
            "myBlogAdminLoggedIn"
        );

    if (
        loggedIn === "false"
    ) {

        window.location.href =
            "admin-login.html";

    }

}
function normalizeAdminImage(image) {

    if (
        !image ||
        String(image).trim() === ""
    ) {

        return "image/hero.jpg";

    }


    let path =
        String(image).trim();

    path =
        path.replace(/\\/g, "/");

    const imageIndex =
        path
            .toLowerCase()
            .indexOf("/image/");


    if (
        imageIndex !== -1
    ) {

        path =
            path.substring(
                imageIndex + 1
            );

    }
    if (
        path
            .toLowerCase()
            .startsWith("image/")
    ) {

        return path;

    }

    if (
        path.startsWith("http://") ||
        path.startsWith("https://") ||
        path.startsWith("data:image/")
    ) {

        return path;

    }


    return path;

}

function getDashboardArticles() {

    try {

        const saved =
            localStorage.getItem(
                "myBlogArticles"
            );


        if (!saved) {

            return [];

        }


        const parsed =
            JSON.parse(saved);


        if (
            Array.isArray(parsed)
        ) {

            return parsed;

        }


        return [];

    }
    catch (error) {

        console.error(
            "Could not load articles:",
            error
        );

        return [];

    }

}
function saveDashboardArticles(
    articles
) {

    try {

        localStorage.setItem(
            "myBlogArticles",
            JSON.stringify(articles)
        );

        return true;

    }
    catch (error) {

        console.error(
            "Could not save articles:",
            error
        );

        alert(
            "Could not save article data."
        );

        return false;

    }

}

function loadAdminDashboard() {

    const articles =
        getDashboardArticles();

    const totalArticles =
        document.getElementById(
            "totalArticles"
        );


    if (totalArticles) {

        totalArticles.textContent =
            articles.length;

    }
    const categories =
        new Set();


    articles.forEach(
        function (article) {

            const category =
                String(
                    article.category || ""
                ).trim();


            if (category) {

                categories.add(
                    category.toLowerCase()
                );

            }

        }
    );


    const totalCategories =
        document.getElementById(
            "totalCategories"
        );


    if (totalCategories) {

        totalCategories.textContent =
            categories.size;

    }

    const adminCount =
        articles.filter(
            function (article) {

                return (
                    article.isAdminAdded === true ||
                    article.source === "admin"
                );

            }
        ).length;


    const adminArticles =
        document.getElementById(
            "adminArticles"
        );


    if (adminArticles) {

        adminArticles.textContent =
            adminCount;

    }

    renderAdminArticles(
        articles
    );

}

function renderAdminArticles(
    articles
) {

    const tbody =
        document.getElementById(
            "articlesTableBody"
        );


    const emptyState =
        document.getElementById(
            "emptyState"
        );


    if (!tbody) {

        return;

    }


    tbody.innerHTML = "";

    if (
        !Array.isArray(articles) ||
        articles.length === 0
    ) {

        if (emptyState) {

            emptyState.style.display =
                "block";

        }

        return;

    }


    if (emptyState) {

        emptyState.style.display =
            "none";

    }
    articles.forEach(
        function (article) {

            const row =
                document.createElement(
                    "tr"
                );
                normalizeAdminImage(
                    article.image
                );


            const title =
                article.title ||
                "Untitled Article";


            const category =
                article.category ||
                "General";


            const date =
                article.date ||
                "";


            const id =
                String(
                    article.id || ""
                );

            const imageCell =
                document.createElement(
                    "td"
                );


            imageCell.className =
                "image-cell";


            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "article-image";


            img.src =
                image;


            img.alt =
                title;


            img.loading =
                "lazy";


            img.onerror =
                function () {

                    this.onerror =
                        null;

                    this.src =
                        "image/hero.jpg";

                };


            imageCell.appendChild(
                img
            );
            const titleCell =
                document.createElement(
                    "td"
                );


            const titleDiv =
                document.createElement(
                    "div"
                );


            titleDiv.className =
                "article-title";


            titleDiv.textContent =
                title;


            titleCell.appendChild(
                titleDiv
            );
            const categoryCell =
                document.createElement(
                    "td"
                );


            const categoryBadge =
                document.createElement(
                    "span"
                );


            categoryBadge.className =
                "category-badge";


            categoryBadge.textContent =
                category;


            categoryCell.appendChild(
                categoryBadge
            );

            const dateCell =
                document.createElement(
                    "td"
                );


            dateCell.textContent =
                date;
            const actionCell =
                document.createElement(
                    "td"
                );


            const actionButtons =
                document.createElement(
                    "div"
                );


            actionButtons.className =
                "action-buttons";
            const viewButton =
                createActionButton(
                    "view-btn",
                    "fa-eye",
                    "View Article"
                );


            viewButton.addEventListener(
                "click",
                function () {

                    dashboardViewArticle(
                        id
                    );

                }
            );

            const editButton =
                createActionButton(
                    "edit-btn",
                    "fa-pen",
                    "Edit Article"
                );


            editButton.addEventListener(
                "click",
                function () {

                    dashboardEditArticle(
                        id
                    );

                }
            );

            const deleteButton =
                createActionButton(
                    "delete-btn",
                    "fa-trash",
                    "Delete Article"
                );


            deleteButton.addEventListener(
                "click",
                function () {

                    dashboardDeleteArticle(
                        id
                    );

                }
            );


            actionButtons.appendChild(
                viewButton
            );


            actionButtons.appendChild(
                editButton
            );


            actionButtons.appendChild(
                deleteButton
            );


            actionCell.appendChild(
                actionButtons
            );

            row.appendChild(
                imageCell
            );


            row.appendChild(
                titleCell
            );


            row.appendChild(
                categoryCell
            );


            row.appendChild(
                dateCell
            );


            row.appendChild(
                actionCell
            );


            tbody.appendChild(
                row
            );

        }
    );

}
function createActionButton(
    className,
    iconName,
    title
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "action-btn " +
        className;


    button.title =
        title;


    const icon =
        document.createElement(
            "i"
        );


    icon.className =
        "fa-solid " +
        iconName;


    button.appendChild(
        icon
    );


    return button;

}
function setupDashboardSearch() {

    const search =
        document.getElementById(
            "articleSearch"
        );


    if (!search) {

        return;

    }


    search.addEventListener(
        "input",
        function () {

            const keyword =
                this.value
                    .toLowerCase()
                    .trim();


            const articles =
                getDashboardArticles();

            if (!keyword) {

                renderAdminArticles(
                    articles
                );

                return;

            }
        

            const filtered =
                articles.filter(
                    function (article) {

                        const title =
                            String(
                                article.title || ""
                            )
                            .toLowerCase();


                        const category =
                            String(
                                article.category || ""
                            )
                            .toLowerCase();


                        const description =
                            String(
                                article.description || ""
                            )
                            .toLowerCase();


                        const content =
                            String(
                                article.content || ""
                            )
                            .toLowerCase();


                        return (
                            title.includes(keyword) ||
                            category.includes(keyword) ||
                            description.includes(keyword) ||
                            content.includes(keyword)
                        );

                    }
                );


            renderAdminArticles(
                filtered
            );

        }
    );

}
function dashboardViewArticle(
    id
) {

    if (!id) {

        alert(
            "Article ID not found."
        );

        return;

    }


    localStorage.setItem(
        "viewArticleId",
        String(id)
    );


    window.location.href =
        "article.html?id=" +
        encodeURIComponent(id);

}

function dashboardEditArticle(
    id
) {

    if (!id) {

        alert(
            "Article ID not found."
        );

        return;

    }


    localStorage.setItem(
        "editArticleId",
        String(id)
    );


    window.location.href =
        "add-article.html";

}

function dashboardDeleteArticle(
    id
) {

    const articles =
        getDashboardArticles();


    const article =
        articles.find(
            function (item) {

                return (
                    String(item.id) ===
                    String(id)
                );

            }
        );


    if (!article) {

        alert(
            "Article not found."
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this article?\n\n" +
            (
                article.title ||
                "Untitled Article"
            )
        );


    if (!confirmed) {

        return;

    }


    const updatedArticles =
        articles.filter(
            function (item) {

                return (
                    String(item.id) !==
                    String(id)
                );

            }
        );


    const saved =
        saveDashboardArticles(
            updatedArticles
        );


    if (!saved) {

        return;

    }


    loadAdminDashboard();


    alert(
        "Article deleted successfully!"
    );

}

function setupLogout() {

    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    if (!logoutBtn) {

        return;

    }


    logoutBtn.addEventListener(
        "click",
        adminLogout
    );

}


function adminLogout() {

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "myBlogAdminLoggedIn"
    );


    localStorage.removeItem(
        "editArticleId"
    );


    localStorage.removeItem(
        "viewArticleId"
    );


    window.location.href =
        "admin-login.html";

}
function setupDashboardDarkMode() {

    const darkBtn =
        document.getElementById(
            "darkBtn"
        );


    const darkIcon =
        document.getElementById(
            "darkIcon"
        );


    const darkText =
        document.getElementById(
            "darkText"
        );
    const saved =
        localStorage.getItem(
            "myBlogDarkMode"
        );


    if (
        saved === "true"
    ) {

        document.body.classList.add(
            "dark-mode"
        );

    }


    updateDarkModeButton();


    if (!darkBtn) {

        return;

    }


    darkBtn.addEventListener(
        "click",
        function () {

            document.body.classList.toggle(
                "dark-mode"
            );


            const enabled =
                document.body.classList.contains(
                    "dark-mode"
                );


            localStorage.setItem(
                "myBlogDarkMode",
                String(enabled)
            );


            updateDarkModeButton();

        }
    );


    function updateDarkModeButton() {

        const enabled =
            document.body.classList.contains(
                "dark-mode"
            );


        if (darkIcon) {

            darkIcon.className =
                enabled
                    ? "fa-solid fa-sun"
                    : "fa-solid fa-moon";

        }


        if (darkText) {

            darkText.textContent =
                enabled
                    ? "Light"
                    : "Dark";

        }

    }

}
