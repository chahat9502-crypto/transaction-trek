<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="transaction.css">
</head>

<body>

<div class="container">

<h1>💰 Expense Tracker</h1>

<div class="summary">

<div class="card income">
<h3>Total Income</h3>
<h2 id="income">₹0</h2>
</div>

<div class="card expense">
<h3>Total Expense</h3>
<h2 id="expense">₹0</h2>
</div>

<div class="card balance">
<h3>Balance</h3>
<h2 id="balance">₹0</h2>
</div>

</div>

<div class="form">

<input type="text" id="title" placeholder="Description">

<input type="number" id="amount" placeholder="Amount">

<input type="date" id="date">

<select id="type">
<option value="Income">Income</option>
<option value="Expense">Expense</option>
</select>

<select id="category">
<option>Salary</option>
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Other</option>
</select>

<button onclick="addTransaction()">Add</button>

</div>

<div class="filter">

<select id="filter" onchange="displayTransactions()">
<option value="All">All Categories</option>
<option>Salary</option>
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Other</option>
</select>

</div>

<table>

<thead>
<tr>
<th>Description</th>
<th>Amount</th>
<th>Type</th>
<th>Category</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>

<script src="tr.js"></script>

</body>
</html>
